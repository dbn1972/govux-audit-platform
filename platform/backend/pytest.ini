[pytest]
addopts = --cov=app --cov-report=term-missing --cov-fail-under=80 -q
testpaths = tests
# put backend/ on sys.path so `import app` works when pytest is run directly
# (CI runners have no PYTHONPATH=/app; the dev image sets it via compose env)
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
