{{/* Audit worker fleet — consumes the Redis-Streams queue; each replica uses a
     unique consumer id and reclaims crashed peers' jobs. Heavy (3 browsers). */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govux.fullname" . }}-worker
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "govux.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "govux.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "govux.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Chromium's sandbox needs care under an arbitrary uid — configurable
      securityContext: {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "govux.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          env: {{- include "govux.backendEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
---
{{/* Scheduler — enqueues scheduled re-audits */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govux.fullname" . }}-scheduler
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels: {{- include "govux.selectorLabels" (dict "root" . "component" "scheduler") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "govux.selectorLabels" (dict "root" . "component" "scheduler") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "govux.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "govux.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.services.scheduler"]
          env: {{- include "govux.backendEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.scheduler.resources | nindent 12 }}
---
{{/* Public-worker — single-concurrency free-scan queue */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govux.fullname" . }}-public-worker
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.publicWorker.replicas }}
  selector:
    matchLabels: {{- include "govux.selectorLabels" (dict "root" . "component" "public-worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "govux.selectorLabels" (dict "root" . "component" "public-worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "govux.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
        - name: public-worker
          image: {{ include "govux.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.public_worker"]
          env: {{- include "govux.backendEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.publicWorker.resources | nindent 12 }}
