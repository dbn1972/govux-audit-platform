{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "govux.fullname" . }}
  labels: {{- include "govux.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API is served under /api (the frontend proxies to it); route it explicitly
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "govux.fullname" . }}-api
                port: { number: {{ .Values.service.api.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "govux.fullname" . }}-web
                port: { number: {{ .Values.service.web.port }} }
{{- end }}
