{{- if not .Values.existingSecret }}
{{- if and .Values.secrets.jwtSecret (eq .Values.secrets.jwtSecret .Values.secrets.secretKey) }}
{{- fail "secrets.jwtSecret and secrets.secretKey MUST differ (one signs tokens, one encrypts secrets at rest)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "govux.secretName" . }}
  labels: {{- include "govux.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ required "secrets.jwtSecret is required (or set existingSecret)" .Values.secrets.jwtSecret | quote }}
  secretKey: {{ required "secrets.secretKey is required (or set existingSecret)" .Values.secrets.secretKey | quote }}
  databaseUrl: {{ required "secrets.databaseUrl is required (or set existingSecret)" .Values.secrets.databaseUrl | quote }}
  cruxApiKey: {{ .Values.secrets.cruxApiKey | default "" | quote }}
{{- end }}
