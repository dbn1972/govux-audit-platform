apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govux.fullname" . }}-api
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "govux.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "govux.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "govux.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "govux.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # migrations run as a hook Job, so the API starts Gunicorn directly
          command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker",
                    "--workers", "4", "--bind", "0.0.0.0:8000", "--timeout", "60",
                    "--access-logfile", "-"]
          ports:
            - name: http
              containerPort: 8000
          env: {{- include "govux.backendEnv" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "govux.fullname" . }}-api
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.api.type }}
  selector: {{- include "govux.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
