apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govux.fullname" . }}-web
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "govux.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "govux.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "govux.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "govux.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # use a production-built frontend image; it proxies /api to the API service
          env:
            - name: NODE_ENV
              value: production
            - name: GOVUX_API_URL
              value: http://{{ include "govux.fullname" . }}-api:{{ .Values.service.api.port }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "govux.fullname" . }}-web
  labels: {{- include "govux.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.web.type }}
  selector: {{- include "govux.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: http
